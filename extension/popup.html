<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1e1e1e;
      --hover: #2a2d2e;
      --border: #3c3c3c;
      --text: #cccccc;
      --muted: #858585;
      --accent: #3794ff;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 8px;
      color: var(--text);
      background: var(--bg);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 9px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .header img { width: 22px; height: 22px; border-radius: 5px; }
    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      color: var(--text);
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .menu-btn:hover { background: var(--hover); }
    .menu-btn svg { color: var(--muted); flex: none; }
    .menu-btn:hover svg { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <span>Astro Browse</span>
  </div>

  <button class="menu-btn" id="save">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    <span>Save current tab as link</span>
  </button>

  <button class="menu-btn" id="browse">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
    </svg>
    <span>Browse all</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
