<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Astro Browse — Settings</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --bg-secondary: #252526;
      --border: #3c3c3c;
      --text: #cccccc;
      --text-secondary: #858585;
      --accent: #3794ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
      max-width: 480px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.4; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .saved {
      margin-top: 10px;
      font-size: 12px;
      color: #48bb78;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Astro Browse</h1>
  <p>Set the URL of your Astro server. Clicking the extension icon opens the Links canvas in the main app on this host.</p>
  <label for="server">Astro Server URL</label>
  <input type="text" id="server" placeholder="http://localhost:8000">
  <div class="saved" id="saved">Saved</div>
  <script src="options.js"></script>
</body>
</html>
